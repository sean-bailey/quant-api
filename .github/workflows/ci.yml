name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements-dev.txt

      - name: Run unit and integration tests
        run: |
          python -m pytest tests/unit tests/integration -v --tb=short -m "not e2e"

      - name: Check for secrets in code
        run: |
          if git grep -l -iE 'api_key|secret|password|token' -- '*.py' | grep -v '.env' | grep -v '__pycache__'; then
            echo "⚠️ Possible secrets found in source files"
            exit 1
          fi
