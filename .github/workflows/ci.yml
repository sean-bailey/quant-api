name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements-dev.txt

      - name: Run unit and integration tests
        run: |
          python -m pytest tests/unit tests/integration -v --tb=short -m "not e2e"

      - name: Check for hardcoded secrets
        run: |
          # Flag actual hardcoded secret VALUES (not variable names, parameter names, or comments)
          # Matches patterns like: api_key = "sk-...", token = "ghp_...", password = "xyz"
          # Excludes: SecretStr, env vars, test fixtures, comments, __pycache__
          if git grep -n -E '(api_key|secret|password|token)\s*=\s*["\x27][A-Za-z0-9_\-]{10,}["\x27]' -- '*.py' \
            | grep -v '.env' \
            | grep -v '__pycache__' \
            | grep -v 'test_' \
            | grep -v 'SecretStr' \
            | grep -v 'os.environ' \
            | grep -v '# ' \
            | grep -v 'get_secret_value'; then
            echo "⚠️ Possible hardcoded secrets found in source files"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"
